<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peças de xadrez</title>
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="demo.css">
<main>
  <h1>Peças de xadrez</h1>
  <section aria-labelledby="board-title">
    <h2 id="board-title">Tabuleiro</h2>
    <div id="board" role="group" aria-labelledby="board-title"></div>
    <div id="controls" class="controls">
      <button type="button" data-action="cavalo">Cavalo em L</button>
      <button type="button" data-action="captura">Captura</button>
      <button type="button" data-action="promocao">Promoção</button>
      <button type="button" data-action="rei">Rei em xeque</button>
      <button type="button" data-action="reset">Reiniciar</button>
    </div>
    <p id="status" role="status">Escolha uma jogada para ver o efeito.</p>
  </section>
  <section aria-labelledby="gallery-title">
    <h2 id="gallery-title">Claras e escuras</h2>
    <button id="transition" type="button">Revelar coleção</button>
    <svg class="definitions" width="0" height="0" aria-hidden="true">
      <defs>
        <clipPath id="reveal-pawn" clipPathUnits="objectBoundingBox">
          <path d="M.37 .27a.13 .13 0 1 1 .26 0a.13 .13 0 1 1 -.26 0M.43 .39h.14Q.58 .62 .69 .73H.31Q.42 .62 .43 .39M.29 .72h.42q.06 0 .06 .06v.02q0 .06 -.06 .06H.29q-.06 0 -.06 -.06v-.02q0 -.06 .06 -.06"/>
        </clipPath>
      </defs>
    </svg>
    <div id="gallery" class="gallery"></div>
  </section>
</main>
<script src="board.js"></script>
<script src="demo.js"></script>
</html>
